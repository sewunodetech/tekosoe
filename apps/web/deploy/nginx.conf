# apps/web di VPS: image nginx (apps/web/Dockerfile) di belakang Traefik, host www.tekosue.xyz (ADR 0012).
# TLS diurus Traefik; container ini hanya HTTP :80. Domain HARUS sama dengan EXPO_PUBLIC_PASSKEY_DOMAIN
# (rpId) dan associatedDomains app. Jangan redirect ke www — Android & Apple tidak mengikuti redirect
# untuk file .well-known. Cek setelah deploy: npm run check:wellknown -- www.tekosue.xyz --sha256 <fingerprint EAS>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Asosiasi passkey / App Links: JSON, langsung 200.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Shell statis: semua kode undangan / nomor invoice dilayani satu HTML (status 200).
    # Sama dengan scripts/shell-routes.mjs. Path /j/<kode> berisi rahasia undangan: jangan di-log.
    location ~ ^/j/[^/]+/?$ {
        access_log off;
        add_header Referrer-Policy "no-referrer";
        try_files /j/_.html =404;
    }
    location ~ ^/v/[^/]+/?$ {
        access_log off;
        add_header Referrer-Policy "no-referrer";
        try_files /v/_.html =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
