# Stack lokal: Hasura + indexer Envio + api. Database Postgres di Neon (tidak ada Postgres lokal);
# mobile jalan terpisah (Expo), web dideploy standalone ke Vercel.
#   npm run docker:up      # build + jalan di background
#   npm run docker:logs    # ikuti log
#   npm run docker:down    # berhenti
#
# Rahasia tetap di .env masing-masing paket (gitignored):
#   apps/api/.env          DATABASE_URL Neon (database api), kunci drip/settler, JWT, …
#   packages/indexer/.env  ENVIO_API_TOKEN + ENVIO_PG_* dan HASURA_GRAPHQL_DATABASE_URL
#                          (database Neon TERPISAH dari api — Envio bisa DROP SCHEMA saat reset)
# Port host bisa diubah lewat .env di root (API_HOST_PORT, HASURA_HOST_PORT, INDEXER_HOST_PORT).
#
# Port 8080 sama dengan `envio dev`; hentikan dulu stack `envio dev` (envio stop) sebelum `up`.

name: tekosoe

services:
  graphql-engine:
    image: hasura/graphql-engine:v2.43.0
    restart: unless-stopped
    # HASURA_GRAPHQL_DATABASE_URL (Neon, sslmode=require) diambil dari sini.
    env_file:
      - packages/indexer/.env
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_NO_OF_RETRIES: "10"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      PORT: "8080"
    ports:
      - "${HASURA_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 30

  indexer:
    build:
      context: .
      dockerfile: packages/indexer/Dockerfile
    restart: unless-stopped
    depends_on:
      graphql-engine:
        condition: service_healthy
    # ENVIO_API_TOKEN + ENVIO_PG_HOST/PORT/USER/PASSWORD/DATABASE/SSL_MODE (Neon).
    env_file:
      - packages/indexer/.env
    environment:
      HASURA_GRAPHQL_ENDPOINT: http://graphql-engine:8080/v1/metadata
      HASURA_GRAPHQL_ROLE: admin
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-testing}
      ENVIO_INDEXER_HOST: 0.0.0.0
      ENVIO_TUI: "false"
      LOG_STRATEGY: console-pretty
    ports:
      - "127.0.0.1:${INDEXER_HOST_PORT:-9898}:9898"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      graphql-engine:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      PORT: "3001"
      # Dari dalam jaringan compose, bukan localhost host.
      ENVIO_GRAPHQL_URL: http://graphql-engine:8080/v1/graphql
    ports:
      - "${API_HOST_PORT:-3001}:3001"
