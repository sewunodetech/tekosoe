[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "../../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 110
