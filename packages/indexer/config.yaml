# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Envio HyperIndex v3 — GroupVault di Monad testnet (HyperSync: https://10143.hypersync.xyz).
# Event harus identik dengan packages/contracts/src/interfaces/IGroupVault.sol.
# Setelah kontrak di-deploy: isi `address` dan `start_block`, lalu `npm run codegen`.
name: tekosoe-indexer
schema: ./schema.graphql

field_selection:
  transaction_fields:
    - hash
    - from

contracts:
  - name: GroupVault
    handler: ./src/EventHandlers.ts
    events:
      - event: GroupCreated(uint256 indexed groupId, address indexed creator, string name, uint64 endsAt, uint64 disputeWindow, uint256 approvalThreshold)
      - event: MemberJoined(uint256 indexed groupId, address indexed member, uint256 pullCap)
      - event: Deposited(uint256 indexed groupId, address indexed member, uint256 amount)
      - event: SpendRequested(uint256 indexed groupId, uint256 indexed spendId, address indexed spender, address to, uint256 amount, address[] participants, uint256[] shares, bytes32 noteHash)
      - event: SpendExecuted(uint256 indexed groupId, uint256 indexed spendId, address indexed spender, address to, uint256 amount, address[] participants, uint256[] shares, bytes32 noteHash)
      - event: SpendRejected(uint256 indexed groupId, uint256 indexed spendId, address indexed by)
      - event: ShareDisputed(uint256 indexed groupId, uint256 indexed spendId, address indexed participant, uint256 share)
      - event: ReceiptAttached(uint256 indexed groupId, uint256 indexed spendId, address indexed by, bytes32 receiptHash)
      - event: Settled(uint256 indexed groupId, uint256 poolBefore)
      - event: Pulled(uint256 indexed groupId, address indexed member, uint256 amount, uint256 remainingDebt)
      - event: Refunded(uint256 indexed groupId, address indexed member, uint256 amount, uint256 remainingCredit)
      - event: DebtPaid(uint256 indexed groupId, address indexed member, uint256 amount)
  # AUSD (Agora) — hanya Transfer dari/ke faucet dan ke "bank" Cash out (filter `where` di handler),
  # untuk baris Top up / Cash out di layar Activity (ADR 0006).
  - name: Ausd
    handler: ./src/EventHandlers.ts
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)

# Nilai per lingkungan dari env (awalan wajib ENVIO_, lihat .env.example). Default = GroupVault v1 testnet.
chains:
  - id: ${ENVIO_CHAIN_ID:-10143} # Monad testnet
    # Blok deploy GroupVault v1 lama (30 Sep 2026): menjaga riwayat Top up / Cash out AUSD. GroupVault saat ini
    # (ADR 0013) di-deploy di blok 68690383; sebelum itu tidak ada event-nya, jadi tidak perlu dimajukan.
    start_block: ${ENVIO_START_BLOCK:-66921819}
    # Sumber utama: HyperSync (butuh ENVIO_API_TOKEN). RPC Monad hanya cadangan saat realtime macet.
    # Tanpa token: set ENVIO_RPC_FOR=sync supaya seluruh sinkron lewat RPC.
    rpc:
      url: ${ENVIO_RPC_URL:-https://testnet-rpc.monad.xyz}
      for: ${ENVIO_RPC_FOR:-fallback}
      # RPC publik Monad membatasi eth_getLogs ke 100 blok per permintaan.
      initial_block_interval: 100
      interval_ceiling: 100
    contracts:
      - name: GroupVault
        address: "${ENVIO_GROUP_VAULT_ADDRESS:-0x02Fb964B6b4470C14D61738EC0a296fa9F2dbCE0}"
      - name: Ausd
        address: "${ENVIO_AUSD_ADDRESS:-0xa9012a055bd4e0eDfF8Ce09f960291C09D5322dC}"
