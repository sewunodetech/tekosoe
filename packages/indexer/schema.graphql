# Entitas Envio untuk GroupVault v1 (ADR 0005). Semua nominal dalam unit AUSD (6 desimal).
# Aturan saldo sama persis dengan kontrak; lihat src/EventHandlers.ts.

enum GroupStatus {
  Active
  Settled
}

enum SpendStatus {
  Pending
  Executed
  Rejected
}

type Group {
  id: ID! # groupId (desimal)
  name: String!
  creator: String!
  endsAt: BigInt!
  disputeWindow: BigInt!
  approvalThreshold: BigInt!
  pool: BigInt!
  status: GroupStatus!
  memberCount: Int!
  createdAt: BigInt!
  settledAt: BigInt
  settleTxHash: String
  members: [Member!]! @derivedFrom(field: "group")
  spends: [Spend!]! @derivedFrom(field: "group")
  activities: [Activity!]! @derivedFrom(field: "group")
}

type Member {
  id: ID! # `${groupId}-${address}`
  group: Group!
  address: String! # lowercase
  deposited: BigInt!
  used: BigInt!
  net: BigInt! # deposited − used, aturan sama persis dengan kontrak
  pullCap: BigInt!
  pulled: BigInt! # ditarik saat settle
  refunded: BigInt! # diterima saat settle / payDebt / claimCredit
  debt: BigInt!
  credit: BigInt!
  joinedAt: BigInt!
  position: Int! # posisi di membersOf(groupId), mulai 1 (members[] di kontrak hanya push)
}

type Spend {
  id: ID! # `${groupId}-${spendId}`
  group: Group!
  spendId: BigInt!
  spender: String!
  to: String!
  amount: BigInt!
  status: SpendStatus!
  noteHash: String!
  requestedAt: BigInt!
  executedAt: BigInt
  receiptCount: Int!
  shares: [SpendShare!]! @derivedFrom(field: "spend")
  receipts: [Receipt!]! @derivedFrom(field: "spend")
}

type SpendShare {
  id: ID! # `${groupId}-${spendId}-${participant}`
  spend: Spend!
  participant: String!
  share: BigInt!
  disputed: Boolean!
}

type Receipt {
  id: ID! # `${txHash}-${logIndex}`
  spend: Spend!
  by: String!
  receiptHash: String!
  timestamp: BigInt!
}

# Saldo dolar pribadi (di luar trip), dari Transfer AUSD — ADR 0006 / layar Activity.
# TopUp  = faucet → user, dikurangi pengembalian user → faucet (app mengembalikan kelebihan faucet).
# CashOut = user → alamat "bank" demo (ENVIO_CASH_OUT_ADDRESS), bukan pembayaran dari GroupVault.
enum BalanceKind {
  TopUp
  CashOut
}

type BalanceActivity {
  id: ID! # `${txHash}-${logIndex}` dari Transfer yang membuatnya
  account: String! @index # lowercase
  kind: BalanceKind!
  amount: BigInt! # bersih (TopUp sudah dikurangi pengembalian)
  timestamp: BigInt!
  txHash: String!
  remaining: BigInt # Pulled → remainingDebt, Refunded → remainingCredit; kosong untuk event lain
}

# Penanda per akun: Top up terakhir, supaya pengembalian ke faucet mengurangi baris yang benar.
type BalanceAccount {
  id: ID! # address lowercase
  lastTopUp: String # id BalanceActivity
  lastTopUpAt: BigInt
}

type Activity {
  id: ID! # `${txHash}-${logIndex}`
  group: Group!
  type: String! # nama event
  actor: String!
  counterparty: String
  amount: BigInt
  spendId: BigInt
  timestamp: BigInt!
  txHash: String!
  remaining: BigInt # Pulled → remainingDebt, Refunded → remainingCredit; kosong untuk event lain
}
