openapi: 3.1.0
info:
  title: Tekosoe API
  version: 0.1.0
  description: |
    Backend mini Tekosoe — penjadwal settle-up, drip biaya jaringan untuk akun baru,
    profil, struk terenkripsi, tukar kunci grup, dan push notification.

    Prinsipnya:
    - Semua data uang (saldo, anggota, pemakaian, hasil settle) **baca dari kontrak + Envio**, bukan dari API ini.
    - Backend tidak pernah memegang kunci atau dana user; kantong backend hanya untuk
      drip biaya jaringan dan memanggil `settle`.
    - Selalu ada field `groupId` sebagai string desimal (bigint on-chain).
    - Endpoint bertanda `FEATURE_RECEIPTS` / `FEATURE_PUSH` hanya ada kalau fitur diaktifkan lewat env.

servers:
  - url: http://localhost:3000
    description: lokal

tags:
  - name: operasional
    description: health, status, dan pemicu manual settle
  - name: onboarding
    description: modal biaya jaringan untuk akun baru
  - name: auth
    description: login tanpa password lewat tanda tangan Mera
  - name: profiles
    description: nama tampilan dan avatar anggota
  - name: receipts
    description: struk terenkripsi (FEATURE_RECEIPTS)
  - name: keys
    description: tukar kunci enkripsi grup (FEATURE_RECEIPTS)
  - name: push
    description: langganan notifikasi (FEATURE_PUSH)
  - name: webhooks
    description: penerima event kontrak dari Alchemy (FEATURE_PUSH)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [operasional]
      summary: Liveness probe
      description: Tidak ada dependensi, tidak pernah gagal. Dipakai healthcheck Railway.
      security: []
      responses:
        "200":
          description: server hidup
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/status:
    get:
      tags: [operasional]
      summary: Status lengkap (admin)
      description: |
        Ping database, blok terakhir, ping Envio, isi scheduler, saldo dua kantong backend
        beserta flag `low`, dan status fitur. Tidak pernah mengembalikan secret.
      security:
        - adminKey: []
      responses:
        "200":
          description: status server
          content:
            application/json:
              schema:
                type: object
                required: [status, db, chain, envio, scheduler, wallets, features]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  db:
                    type: object
                    properties:
                      ok: { type: boolean }
                      latencyMs: { type: [number, "null"] }
                      error: { type: string }
                  chain:
                    type: object
                    properties:
                      ok: { type: boolean }
                      chainId: { type: [number, "null"] }
                      latestBlockTimestamp: { type: [number, "null"] }
                      error: { type: string }
                  envio:
                    type: object
                    properties:
                      ok: { type: boolean }
                  scheduler:
                    type: object
                    properties:
                      lastTickAt: { type: [string, "null"], format: date-time }
                      lastTickDurationMs: { type: [number, "null"] }
                      lastError: { type: [string, "null"] }
                      dueCandidates: { type: [number, "null"] }
                      running: { type: boolean }
                  wallets:
                    type: object
                    properties:
                      drip: { $ref: "#/components/schemas/WalletStatus" }
                      settler: { $ref: "#/components/schemas/WalletStatus" }
                  features:
                    type: object
                    properties:
                      receipts: { type: boolean }
                      push: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/onboard/drip:
    post:
      tags: [onboarding]
      summary: Kirim biaya jaringan ke akun baru
      description: |
        FR-03/US-01. Akun baru belum punya MON, padahal transaksi pertamanya
        (gabung + setor) butuh biaya jaringan. Endpoint ini tanpa auth karena
        sesi belum ada, jadi dilindungi: rate limit per IP (`DRIP_RATE_LIMIT_PER_HOUR`),
        batas harian global (`DRIP_DAILY_CAP`), satu klaim per alamat, dan cek saldo.

        Balasan `funded` hanya keluar setelah transaksi benar-benar terkonfirmasi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: hasil drip
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [already_funded, sufficient_balance, funded]
                  txHash:
                    type: string
                    description: hanya untuk status `funded`
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: klaim sebelumnya masih berjalan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: rate limit per IP atau batas harian tercapai (`DRIP_LIMIT_REACHED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: pengiriman gagal (`DRIP_FAILED`) — klaim dilepas, boleh dicoba lagi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/auth/challenge:
    post:
      tags: [auth]
      summary: Minta tantangan login (SIWE)
      description: |
        Menghasilkan pesan EIP-4361 unik yang berlaku 5 menit dan hanya bisa dipakai
        sekali. App menampilkan pesan ini ke Mera untuk ditandatangani user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: tantangan
          content:
            application/json:
              schema:
                type: object
                required: [message, nonce, expiresAt]
                properties:
                  message:
                    type: string
                    description: teks SIWE yang harus ditandatangani persis
                  nonce:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/verify:
    post:
      tags: [auth]
      summary: Tukar tantangan + tanda tangan dengan token
      description: |
        Memverifikasi tanda tangan, memastikan tantangan belum dipakai dan belum
        kedaluwarsa, menandainya terpakai (anti-replay), lalu menerbitkan JWT HS256
        berlaku `AUTH_TOKEN_TTL_SECONDS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature]
              properties:
                address:
                  $ref: "#/components/schemas/Address"
                signature:
                  type: string
                  pattern: "^0x[0-9a-fA-F]+$"
                  maxLength: 1030
      responses:
        "200":
          description: token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: "`INVALID_SIGNATURE` atau `CHALLENGE_NOT_FOUND` (sudah dipakai/kedaluwarsa)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/profiles/me:
    put:
      tags: [profiles]
      summary: Simpan nama tampilan milik sendiri
      description: |
        Nama tampilan bersifat publik (dipakai layar undangan). Maks 40 karakter setelah
        trim, tanpa karakter kontrol. `avatar` berupa emoji atau kunci preset — URL ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 40
                avatar:
                  type: string
                  maxLength: 32
                  description: emoji atau kunci preset; tidak boleh berupa URL
      responses:
        "200":
          description: profil tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [profiles]
      summary: Ambil profil milik sendiri
      description: Dipakai app untuk mengecek apakah profil sudah diisi (belum ada → 404).
      responses:
        "200":
          description: profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`PROFILE_NOT_FOUND` — belum pernah mengisi profil"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/profiles:
    get:
      tags: [profiles]
      summary: Ambil banyak profil (publik)
      description: |
        Dipakai layar link undangan sebelum user bergabung. Maksimal 20 alamat per
        permintaan dan kena rate limit. Hanya alamat yang punya profil yang dikembalikan.
        **Nama tampilan bersifat publik.**
      security: []
      parameters:
        - name: addresses
          in: query
          required: true
          description: dipisah koma, maksimal 20 alamat
          schema:
            type: string
            example: "0x1111111111111111111111111111111111111111,0x2222222222222222222222222222222222222222"
      responses:
        "200":
          description: profil yang ditemukan
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [address, displayName, avatar]
                      properties:
                        address: { type: string }
                        displayName: { type: string }
                        avatar: { type: [string, "null"] }
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/settle/{groupId}:
    post:
      tags: [operasional]
      summary: Paksa settle satu grup sekarang (admin)
      description: Jaring pengaman demo — menjalankan langkah settle untuk satu grup, mengabaikan backoff.
      security:
        - adminKey: []
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: hasil percobaan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleAttemptResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/settle:
    get:
      tags: [operasional]
      summary: Riwayat settle (admin)
      description: 50 baris `settle_runs` terbaru.
      security:
        - adminKey: []
      responses:
        "200":
          description: daftar percobaan
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      required: [groupId, status, attempts, updatedAt]
                      properties:
                        groupId: { type: string }
                        status:
                          type: string
                          enum: [submitted, confirmed, failed, skipped]
                        txHash: { type: [string, "null"] }
                        attempts: { type: integer }
                        nextAttemptAt: { type: [string, "null"], format: date-time }
                        lastError: { type: [string, "null"] }
                        updatedAt: { type: string, format: date-time }
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/receipts/upload-url:
    post:
      tags: [receipts]
      summary: Minta tautan unggah struk (FEATURE_RECEIPTS)
      description: |
        Membuat baris receipt `pending` lalu memberi presigned PUT (5 menit) ke penyimpanan.
        Backend hanya menerima ciphertext — enkripsi terjadi di perangkat.
        Wajib anggota grup; `sizeBytes` dibatasi `RECEIPT_MAX_BYTES` (default 5 MB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId, sizeBytes]
              properties:
                groupId:
                  type: string
                  pattern: "^[0-9]+$"
                sizeBytes:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: tautan unggah
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, uploadUrl, headers, expiresInSeconds]
                properties:
                  receiptId: { type: string }
                  uploadUrl: { type: string, format: uri }
                  headers:
                    type: object
                    additionalProperties: { type: string }
                  expiresInSeconds: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"
        "413":
          description: "`RECEIPT_TOO_LARGE` — melebihi `RECEIPT_MAX_BYTES`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/receipts/{id}/confirm:
    post:
      tags: [receipts]
      summary: Konfirmasi struk sudah terunggah (FEATURE_RECEIPTS)
      description: |
        `HeadObject` wajib ada dan ukurannya harus persis sama dengan yang dideklarasikan.
        Objek yang melebihi batas dihapus. Dengan `RECEIPT_VERIFY_HASH=true`, isi objek
        diunduh dan `keccak256(bytes)` harus sama dengan `noteHash`. Idempoten.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [noteHash]
              properties:
                noteHash:
                  type: string
                  pattern: "^0x[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: siap dipakai
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, status]
                properties:
                  receiptId: { type: string }
                  status: { type: string, const: ready }
        "400":
          description: ukuran tidak cocok atau `noteHash` tidak cocok dengan isi file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`NOT_RECEIPT_OWNER` — hanya pengunggah yang boleh mengonfirmasi"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: "`RECEIPT_NOT_FOUND` atau `RECEIPT_NOT_UPLOADED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: objek melebihi batas (objek ikut dihapus)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/receipts/by-hash/{noteHash}:
    get:
      tags: [receipts]
      summary: Ambil tautan unduh struk dari noteHash (FEATURE_RECEIPTS)
      description: |
        `noteHash` datang dari data pemakaian di Envio. Pemanggil harus anggota dari
        grup pemilik receipt, kalau tidak → 403. Mengembalikan presigned GET 5 menit.
      security: []
      parameters:
        - name: noteHash
          in: path
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: tautan unduh
          content:
            application/json:
              schema:
                type: object
                required: [receiptId, groupId, sizeBytes, downloadUrl]
                properties:
                  receiptId: { type: string }
                  groupId: { type: string }
                  sizeBytes: { type: integer }
                  downloadUrl: { type: string, format: uri }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"
        "404":
          description: "`RECEIPT_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/groups/{groupId}/receipts:
    get:
      tags: [receipts]
      summary: Daftar struk milik satu grup (FEATURE_RECEIPTS)
      description: Metadata struk `ready` tanpa tautan unduh. Wajib anggota grup.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: daftar struk
          content:
            application/json:
              schema:
                type: object
                required: [receipts]
                properties:
                  receipts:
                    type: array
                    items:
                      type: object
                      required: [receiptId, groupId, uploader, sizeBytes, status, createdAt]
                      properties:
                        receiptId: { type: string }
                        groupId: { type: string }
                        uploader: { type: string }
                        noteHash: { type: [string, "null"] }
                        sizeBytes: { type: integer }
                        status: { type: string, enum: [pending, ready] }
                        createdAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"

  /api/keys/me:
    put:
      tags: [keys]
      summary: Simpan kunci publik enkripsi milik sendiri (FEATURE_RECEIPTS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encPublicKey]
              properties:
                encPublicKey:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          description: tersimpan
          content:
            application/json:
              schema:
                type: object
                required: [address, encPublicKey]
                properties:
                  address: { type: string }
                  encPublicKey: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/groups/{groupId}/keys:
    get:
      tags: [keys]
      summary: Kunci publik semua anggota grup (FEATURE_RECEIPTS)
      description: Daftar anggota dibaca langsung dari kontrak `membersOf`; yang belum menyimpan kunci bernilai `null`.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: daftar kunci
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [address, encPublicKey]
                      properties:
                        address: { type: string }
                        encPublicKey: { type: [string, "null"] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"

  /api/groups/{groupId}/key-wraps:
    put:
      tags: [keys]
      summary: Kirim kunci grup yang sudah dibungkus untuk anggota lain (FEATURE_RECEIPTS)
      description: |
        Maksimal 10 wrap per permintaan. Setiap `member` wajib anggota grup di kontrak.
        **Insert-only** — wrap yang sudah ada tidak pernah ditimpa; `created` berisi
        jumlah baris yang benar-benar dibuat.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wraps]
              properties:
                wraps:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [member, wrappedKey]
                    properties:
                      member: { $ref: "#/components/schemas/Address" }
                      wrappedKey: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: hasil
          content:
            application/json:
              schema:
                type: object
                required: [created, requested]
                properties:
                  created: { type: integer }
                  requested: { type: integer }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"

  /api/groups/{groupId}/key-wraps/me:
    get:
      tags: [keys]
      summary: Kunci grup milik saya (FEATURE_RECEIPTS)
      description: 404 `KEY_WRAP_NOT_FOUND` berarti belum ada yang mengirim kunci untuk anggota ini.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: wrap milik saya
          content:
            application/json:
              schema:
                type: object
                required: [wrappedKey, wrappedBy, createdAt]
                properties:
                  wrappedKey: { type: string }
                  wrappedBy: { type: string }
                  createdAt: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotGroupMember"
        "404":
          description: "`KEY_WRAP_NOT_FOUND`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/push/vapid-public-key:
    get:
      tags: [push]
      summary: Kunci VAPID publik (FEATURE_PUSH)
      security: []
      responses:
        "200":
          description: kunci publik
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string }

  /api/push/subscribe:
    post:
      tags: [push]
      summary: Daftar notifikasi (FEATURE_PUSH)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048 }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        "201":
          description: terdaftar (upsert per `endpoint`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [push]
      summary: Cabut langganan notifikasi (FEATURE_PUSH)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048 }
      responses:
        "200":
          description: dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/webhooks/alchemy:
    post:
      tags: [webhooks]
      summary: Webhook event kontrak dari Alchemy (FEATURE_PUSH)
      description: |
        Body dibaca dalam bentuk mentah (`express.raw`). Signature HMAC-SHA256 dari
        `ALCHEMY_WEBHOOK_SIGNING_KEY` dibandingkan dengan header `x-alchemy-signature`
        secara constant-time. Setelah signature sah, server membalas 200 secepatnya dan
        memproses di belakang: log difilter ke alamat kontrak, di-dedup lewat
        `processed_events`, didekode, lalu memicu push notification.
      security: []
      parameters:
        - name: x-alchemy-signature
          in: header
          required: true
          description: hex HMAC-SHA256 dari body mentah
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: payload webhook Alchemy (custom/GraphQL) yang memuat `logs[]`
      responses:
        "200":
          description: diterima (diproses setelah balasan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        "401":
          description: "`INVALID_SIGNATURE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: token dari `POST /api/auth/verify`
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: bandingkan dengan `ADMIN_API_KEY`

  parameters:
    GroupIdPath:
      name: groupId
      in: path
      required: true
      description: id grup (desimal, bigint on-chain)
      schema:
        type: string
        pattern: "^[0-9]+$"
        example: "1"

  responses:
    Unauthorized:
      description: token hilang, tidak sah, atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: "`FORBIDDEN` (kunci admin salah) atau `ADMIN_KEY_NOT_CONFIGURED`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: "`VALIDATION_ERROR` — input tidak lolos zod"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: "`RATE_LIMITED` — terlalu banyak permintaan"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotGroupMember:
      description: "`NOT_GROUP_MEMBER` — bukan anggota grup (dicek on-chain)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: kode SCREAMING_SNAKE, contoh VALIDATION_ERROR, NOT_GROUP_MEMBER
            message:
              type: string
            details:
              type: object
              additionalProperties: true
      examples:
        - error:
            code: NOT_GROUP_MEMBER
            message: You are not a member of this group
            details: {}

    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      example: "0x1111111111111111111111111111111111111111"

    Profile:
      type: object
      required: [address, displayName, avatar, updatedAt]
      properties:
        address: { type: string, description: bentuk EIP-55 }
        displayName: { type: string }
        avatar: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }

    WalletStatus:
      type: object
      properties:
        address: { type: string }
        balanceMon: { type: [number, "null"] }
        low: { type: boolean, description: di bawah LOW_BALANCE_THRESHOLD_MON }

    SettleAttemptResult:
      type: object
      required: [groupId, status, durationMs]
      properties:
        groupId: { type: string }
        status:
          type: string
          enum: [confirmed, skipped, failed, too_early, backoff]
        txHash: { type: string }
        error: { type: string }
        attempts: { type: integer }
        durationMs: { type: integer }
